name: Vinted Delta Species Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('vinted-bot/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Restore seen listings DB
        uses: actions/cache@v4
        with:
          path: vinted-bot/seen_listings.db
          key: seen-listings-db-${{ github.run_id }}
          restore-keys: |
            seen-listings-db-

      - name: Install dependencies
        run: pip install -r vinted-bot/requirements.txt

      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python vinted-bot/main.py
